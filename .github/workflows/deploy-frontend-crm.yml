name: Deploy Frontend CRM

on:
  push:
    branches: [main]
    paths:
      - "frontend-crm/**"
      - ".github/workflows/deploy-frontend-crm.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-crm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-crm/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_CRM_BASE_URL: ${{ secrets.CRM_VITE_CRM_BASE_URL }}
          VITE_CORE_BASE_URL: ${{ secrets.CRM_VITE_CORE_BASE_URL }}
          VITE_API_URL: ${{ secrets.CRM_VITE_CRM_BASE_URL }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend-crm/dist --project-name=crm-app --branch=main
