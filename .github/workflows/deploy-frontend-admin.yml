name: Deploy Frontend Admin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend-admin/**"
      - ".github/workflows/deploy-frontend-admin.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_CORE_BASE: ${{ secrets.ADMIN_VITE_CORE_BASE }}
          VITE_CRM_BASE: ${{ secrets.ADMIN_VITE_CRM_BASE }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-admin
          command: deploy
